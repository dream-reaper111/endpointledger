[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endpointledger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
evtx = ["python-evtx"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
endpointledger = "endpointledger.cli:main"

[tool.setuptools.packages.find]
include = ["endpointledger*"]

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]
